<style>
:root { --bg: #1f3b30; --ink: #f3f1e7; --muted: #b5c8bb; --giz-amarelo: #f3d677; --madeira: #6e4a2d; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
  background-color: var(--bg);
  background-image:
    radial-gradient(120% 60% at 15% -10%, rgba(255, 255, 255, .07), transparent 60%),

  border-top: 10px solid var(--madeira);
  color: var(--ink); font-family: "Literata", Georgia, serif; font-size: 17px; line-height: 1.6; text-align: center;
}
main { max-width: 520px; }
img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
h1 { margin: 18px 0 6px; font-family: "Cabin Sketch", "Archivo", sans-serif; font-weight: 700; font-size: 44px; line-height: 1; }
p { margin: 0 0 14px; color: var(--muted); }
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; margin-top: 22px; font-family: "Archivo", system-ui, sans-serif; font-weight: 600; }
a { color: var(--giz-amarelo); text-underline-offset: 3px; }
a:focus-visible { outline: 2px dashed #f4a9bd; outline-offset: 3px; border-radius: 4px; }
